<script type="text/javascript"{% with request_nonce=request.csp_nonce|stringformat:"s" %}{% if request_nonce %} nonce="{{ request_nonce }}"{% else %}{% with nonce=csp_nonce|stringformat:"s" %}{% if nonce %} nonce="{{ nonce }}"{% endif %}{% endwith %}{% endif %}{% endwith %}>
	window.onload = function() {
		document.forms[0].submit();
	};
</script>
<p>
You're being redirected to a SSO logout page.
Please click the button below if you're not redirected automatically within a few seconds.
</p>
<form method="post" action="{{ target_url }}">
	{% for key, value in params.items %}
	    <input type="hidden" name="{{ key }}" value="{{ value }}" />
	{% endfor %}
    <input type="submit" value="Log out" />
</form>
