[tox]
envlist =
    py{3.10,3.11,3.12,3.13}-django5.2
    py{3.12,3.13}-django{6.0,6.1}

[testenv]
commands =
    pip list
    python tests/run_tests.py

deps =
    django5.2: django~=5.2.17
    django6.0: django~=6.0.8
    django6.1: django~=6.1.1
    djangomaster: https://github.com/django/django/archive/master.tar.gz
    .

ignore_outcome =
    djangomaster: True

setenv =
    PYTHONWARNINGS=module::DeprecationWarning
